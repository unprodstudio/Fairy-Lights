plugins {
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom' version '1.19-SNAPSHOT'
}

version = '9.0.0-fabric'
group = 'me.paulf.fairylights'
base {
    archivesName = 'fairylights'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

loom.accessWidenerPath = file("src/main/resources/fairylights.accesswidener")

//sourceSets.main.resources { srcDir 'src/generated/resources' }

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    mavenLocal()
    maven {
        name = 'Progwml6 maven'
        url = 'https://dvs1.progwml6.com/files/maven/'
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
    maven {
        url "https://maven.terraformersmc.com/releases"
    }
    maven {
        url 'https://maven.parchmentmc.org'
    }
    maven {
        url 'https://maven.architectury.dev'
    }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        name = "Ladysnake Mods"
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        name = "devOS"
        url "https://mvn.devos.one/releases/"
    }

    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/Salandora/Porting-Lib")
        credentials {
            username = System.getenv("GITHUB_USER")
            password = System.getenv("GITHUB_TOKEN")
        }
        content {
            includeGroupByRegex "io.github.fabricators_of_create.Porting-Lib.*"
        }
    }

    maven {
        name = "devOS (Snapshots)"
        url "https://mvn.devos.one/snapshots/"
    }

    maven {
        name = "JitPack"
        url "https://jitpack.io/"
    }

    maven {
        name = "Cafeteria Dev"
        url "https://maven.cafeteria.dev/releases/"
    }

    maven {
        name = "JamiesWhiteShirt Dev"
        url "https://maven.jamieswhiteshirt.com/libs-release"
        content {
            includeGroup("com.jamieswhiteshirt")
        }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation "net.fabricmc:fabric-loader:0.20.1"
    implementation "net.fabricmc.fabric-api:fabric-api:0.166.0+26.3"

//    def jeiVersion = "31.17.0.109"
//    compileOnly("mezz.jei:jei-26.3-common-api:$jeiVersion")
//    compileOnly("mezz.jei:jei-26.3-fabric-api:$jeiVersion")
//    runtimeOnly("mezz.jei:jei-26.3-fabric:$jeiVersion")

    api "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:26.3.1"

    def ccaVersion = "8.1.0"
    include(implementation("org.ladysnake.cardinal-components-api:cardinal-components-base:$ccaVersion"))
    include(implementation("org.ladysnake.cardinal-components-api:cardinal-components-block:$ccaVersion"))
    include(implementation("org.ladysnake.cardinal-components-api:cardinal-components-entity:$ccaVersion"))
}

processResources {
    def properties = [
            "loader_version": "0.20.1",
            "fabric_version": "0.166.0+26.3",
            "minecraft_version": "26.3",
            "architectury_version": "22.0.5",
            "version": project.version
    ]

    properties.forEach { key, value ->
        inputs.property(key, value)
    }

    filesMatching("fabric.mod.json") {
        expand(properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}